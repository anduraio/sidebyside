<!doctype html>
<html lang="en" data-orientation="row" data-fullscreen="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Side by Side</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script>
      window.__SBS__ = __SBS_CONFIG__
    </script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <defs>
        <symbol id="i-reload" viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
          <path d="M3 21v-5h5" />
        </symbol>
        <symbol id="i-external" viewBox="0 0 24 24">
          <path d="M15 3h6v6" />
          <path d="M10 14 21 3" />
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        </symbol>
        <symbol id="i-maximize" viewBox="0 0 24 24">
          <path d="M8 3H5a2 2 0 0 0-2 2v3" />
          <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
          <path d="M3 16v3a2 2 0 0 0 2 2h3" />
          <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
        </symbol>
        <symbol id="i-minimize" viewBox="0 0 24 24">
          <path d="M8 3v3a2 2 0 0 1-2 2H3" />
          <path d="M21 8h-3a2 2 0 0 1-2-2V3" />
          <path d="M3 16h3a2 2 0 0 1 2 2v3" />
          <path d="M16 21v-3a2 2 0 0 1 2-2h3" />
        </symbol>
        <symbol id="i-swap" viewBox="0 0 24 24">
          <path d="M8 3 4 7l4 4" />
          <path d="M4 7h16" />
          <path d="m16 21 4-4-4-4" />
          <path d="M20 17H4" />
        </symbol>
        <symbol id="i-columns" viewBox="0 0 24 24">
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="M12 3v18" />
        </symbol>
        <symbol id="i-rows" viewBox="0 0 24 24">
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="M3 12h18" />
        </symbol>
        <symbol id="i-monitor" viewBox="0 0 24 24">
          <rect width="20" height="14" x="2" y="3" rx="2" />
          <path d="M8 21h8" />
          <path d="M12 17v4" />
        </symbol>
        <symbol id="i-alert" viewBox="0 0 24 24">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
        </symbol>
        <symbol id="i-eye" viewBox="0 0 24 24">
          <path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0" />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-eye-off" viewBox="0 0 24 24">
          <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
          <path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
          <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
          <path d="m2 2 20 20" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </symbol>
      </defs>
    </svg>

    <header class="topbar">
      <div class="brand">
        <svg class="i brand-mark"><use href="#i-columns" /></svg>
        <span>Side by Side</span>
      </div>

      <div class="topbar-spacer"></div>

      <div class="seg" role="group" aria-label="Layout">
        <button type="button" data-layout="row" title="Side by side">
          <svg class="i"><use href="#i-columns" /></svg>
        </button>
        <button type="button" data-layout="col" title="Stacked">
          <svg class="i"><use href="#i-rows" /></svg>
        </button>
      </div>

      <button type="button" class="btn btn-icon" id="toggle-bars" title="Hide the pane toolbars — Alt+B">
        <svg class="i icon-eye"><use href="#i-eye" /></svg>
        <svg class="i icon-eye-off"><use href="#i-eye-off" /></svg>
      </button>

      <button type="button" class="btn" id="swap" title="Swap panes — Alt+S">
        <svg class="i"><use href="#i-swap" /></svg>
        <span>Swap</span>
      </button>

      <button type="button" class="btn" id="reload-all" title="Reload both panes — Alt+R">
        <svg class="i"><use href="#i-reload" /></svg>
        <span>Reload</span>
      </button>
    </header>

    <main class="stage" id="stage">
      <section class="pane" data-pane="0">
        <div class="pane-bar">
          <button type="button" class="icon-btn" data-act="reload" title="Reload this pane">
            <svg class="i"><use href="#i-reload" /></svg>
          </button>

          <form class="url-form" novalidate>
            <input
              class="url-input"
              type="text"
              placeholder="localhost:3000"
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
              aria-label="Address for the left pane"
            />
          </form>

          <div class="seg mode" role="group" aria-label="Embedding mode">
            <button type="button" data-mode="direct" title="Direct — embed the site exactly as it is. Best for local dev servers.">Direct</button>
            <button type="button" data-mode="proxy" title="Proxy — route the page through sbs and strip the headers that block embedding.">Proxy</button>
          </div>

          <button type="button" class="icon-btn" data-act="external" title="Open in a new tab">
            <svg class="i"><use href="#i-external" /></svg>
          </button>
          <button type="button" class="icon-btn" data-act="full" title="Fullscreen this pane — Alt+F">
            <svg class="i icon-expand"><use href="#i-maximize" /></svg>
            <svg class="i icon-collapse"><use href="#i-minimize" /></svg>
          </button>
        </div>

        <div class="frame-wrap">
          <iframe
            class="frame"
            title="Left pane"
            allow="clipboard-read; clipboard-write; fullscreen; autoplay"
            allowfullscreen
          ></iframe>

          <div class="overlay empty-state">
            <svg class="i empty-icon"><use href="#i-monitor" /></svg>
            <p class="empty-title">Nothing loaded yet</p>
            <p class="empty-hint">
              <span class="hint-bars">Type an address above, or start from a local port</span>
              <span class="hint-hidden">Toolbars are hidden — press Alt+B to bring them back</span>
            </p>
            <div class="chips">
              <button type="button" class="chip" data-fill="localhost:3000">:3000</button>
              <button type="button" class="chip" data-fill="localhost:5173">:5173</button>
              <button type="button" class="chip" data-fill="localhost:8080">:8080</button>
              <button type="button" class="chip" data-fill="localhost:8000">:8000</button>
            </div>
          </div>

          <div class="overlay error-state">
            <svg class="i error-icon"><use href="#i-alert" /></svg>
            <p class="error-title"></p>
            <p class="error-detail"></p>
            <div class="error-actions">
              <button type="button" class="btn" data-act="retry">Try again</button>
              <button type="button" class="btn" data-act="external">Open in a new tab</button>
            </div>
          </div>

          <div class="progress"></div>
        </div>
      </section>

      <div class="divider" id="divider" role="separator" aria-orientation="vertical" tabindex="-1">
        <span class="divider-grip"></span>
      </div>

      <section class="pane" data-pane="1">
        <div class="pane-bar">
          <button type="button" class="icon-btn" data-act="reload" title="Reload this pane">
            <svg class="i"><use href="#i-reload" /></svg>
          </button>

          <form class="url-form" novalidate>
            <input
              class="url-input"
              type="text"
              placeholder="example.com"
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
              aria-label="Address for the right pane"
            />
          </form>

          <div class="seg mode" role="group" aria-label="Embedding mode">
            <button type="button" data-mode="direct" title="Direct — embed the site exactly as it is. Best for local dev servers.">Direct</button>
            <button type="button" data-mode="proxy" title="Proxy — route the page through sbs and strip the headers that block embedding.">Proxy</button>
          </div>

          <button type="button" class="icon-btn" data-act="external" title="Open in a new tab">
            <svg class="i"><use href="#i-external" /></svg>
          </button>
          <button type="button" class="icon-btn" data-act="full" title="Fullscreen this pane — Alt+F">
            <svg class="i icon-expand"><use href="#i-maximize" /></svg>
            <svg class="i icon-collapse"><use href="#i-minimize" /></svg>
          </button>
        </div>

        <div class="frame-wrap">
          <iframe
            class="frame"
            title="Right pane"
            allow="clipboard-read; clipboard-write; fullscreen; autoplay"
            allowfullscreen
          ></iframe>

          <div class="overlay empty-state">
            <svg class="i empty-icon"><use href="#i-monitor" /></svg>
            <p class="empty-title">Nothing loaded yet</p>
            <p class="empty-hint">
              <span class="hint-bars">Type an address above, or start from a local port</span>
              <span class="hint-hidden">Toolbars are hidden — press Alt+B to bring them back</span>
            </p>
            <div class="chips">
              <button type="button" class="chip" data-fill="localhost:3000">:3000</button>
              <button type="button" class="chip" data-fill="localhost:5173">:5173</button>
              <button type="button" class="chip" data-fill="localhost:8080">:8080</button>
              <button type="button" class="chip" data-fill="localhost:8000">:8000</button>
            </div>
          </div>

          <div class="overlay error-state">
            <svg class="i error-icon"><use href="#i-alert" /></svg>
            <p class="error-title"></p>
            <p class="error-detail"></p>
            <div class="error-actions">
              <button type="button" class="btn" data-act="retry">Try again</button>
              <button type="button" class="btn" data-act="external">Open in a new tab</button>
            </div>
          </div>

          <div class="progress"></div>
        </div>
      </section>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
